<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스마트시티 지도</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/common.css') }}"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/map.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/fullscreen.css') }}"
    />
  </head>

  <body>
    {% include 'nav.html' %}

    <div class="map-page">
      <!-- ================= Header ================= -->

      <header class="map-header">
        <div>
          <div class="section-badge bg-energy">Smart City GIS</div>

          <h1>🗺 광주 스마트시티 지도</h1>

          <p>
            전기차 충전소, 공영주차장, 주정차금지구역 위치를 지도에서 탐색할 수
            있습니다.
          </p>
        </div>

        <div class="header-stat">
          <div class="stat-box">
            <div class="stat-label">표시 시설</div>

            <div class="stat-value" id="totalFacilityCount">-</div>
          </div>
        </div>
      </header>

      <!-- ================= Main ================= -->

      <div class="map-body">
        <!-- ========= Sidebar ========= -->

        <aside class="sidebar">
          <div class="sidebar-card">
            <div class="card-title">시설 선택</div>

            <label class="layer-item">
              <input type="checkbox" id="layerEV" checked />
              <span class="layer-dot ev"></span>
              전기차 충전소
              <span class="layer-count" id="evCount">0</span>
            </label>

            <label class="layer-item">
              <input type="checkbox" id="layerParking" checked />
              <span class="layer-dot parking"></span>
              공영주차장
              <span class="layer-count" id="parkingCount">0</span>
            </label>

            <label class="layer-item">
              <input type="checkbox" id="layerSchool" checked />
              <span class="layer-dot child"></span>
              주정차금지구역
              <span class="layer-count" id="childCount">0</span>
            </label>
          </div>

          <div class="sidebar-card">
            <div class="card-title">시설 목록</div>

            <input
              id="searchInput"
              class="search-input"
              type="text"
              placeholder="시설명 검색"
            />

            <div class="facility-list" id="facilityList"></div>
          </div>
        </aside>

        <!-- ========= Map ========= -->

        <section class="map-section">
          <div id="mapContainer"></div>
        </section>
      </div>

      <!-- ================= Detail ================= -->

      <section class="detail-section">
        <div class="detail-title">시설 상세정보</div>

        <div class="detail-content" id="facilityDetail">
          <div class="empty-message">
            지도 또는 목록에서 시설을 선택해주세요.
          </div>
        </div>
      </section>
    </div>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7397b3e6830a39485714e437e993298a&libraries=services"></script>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/map.js') }}"></script>
  </body>
</html>
