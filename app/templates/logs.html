<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 라운지 | 로그 관리</title>

    <style>
      /* =========================
       1. 기본 설정
    ========================= */
      :root {
        --primary: #168f68;
        --primary-dark: #087354;
        --primary-light: #e9f6ef;
        --background: #f5f7f8;
        --surface: #ffffff;
        --text: #202b35;
        --text-sub: #75818c;
        --border: #e6eaed;
        --success: #168f68;
        --warning: #d58a20;
        --danger: #d94b4b;
        --sidebar-width: 248px;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR",
          sans-serif;
        background: var(--background);
        color: var(--text);
        font-size: 14px;
      }

      button,
      input,
      select {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .app {
        min-height: 100vh;
      }

      /* =========================
       2. 사이드바
    ========================= */
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 100;
        width: var(--sidebar-width);
        padding: 28px 18px;
        background: #fff;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        transition: transform 0.25s ease;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 8px 30px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--primary);
        color: white;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 800;
      }

      .brand-name {
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }

      .brand-sub {
        margin-top: 4px;
        color: var(--text-sub);
        font-size: 11px;
      }

      .nav-label {
        padding: 0 12px;
        margin: 8px 0 10px;
        color: #9aa3ab;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .nav-menu {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .nav-item {
        width: 100%;
        padding: 13px 14px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: #66737e;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        transition: 0.2s;
      }

      .nav-item:hover {
        background: #f5f8f6;
        color: var(--primary-dark);
      }

      .nav-item.active {
        background: var(--primary-light);
        color: var(--primary-dark);
        font-weight: 700;
      }

      .nav-icon {
        width: 22px;
        text-align: center;
        font-size: 17px;
      }

      .sidebar-bottom {
        margin-top: auto;
        padding: 18px 12px 0;
        border-top: 1px solid var(--border);
        color: var(--text-sub);
        font-size: 12px;
        line-height: 1.8;
      }

      .status-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        margin-right: 6px;
        border-radius: 50%;
        background: var(--success);
      }

      /* =========================
       3. 메인 영역
    ========================= */
      .main {
        margin-left: var(--sidebar-width);
        min-width: 0;
        min-height: 100vh;
      }

      .topbar {
        height: 76px;
        padding: 0 34px;
        background: #fff;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .breadcrumb {
        color: var(--text-sub);
        font-size: 13px;
      }

      .breadcrumb strong {
        color: var(--text);
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--text-sub);
        font-size: 12px;
      }

      .admin-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--primary-light);
        color: var(--primary-dark);
        display: grid;
        place-items: center;
        font-weight: 800;
      }

      .menu-toggle {
        display: none;
        width: 38px;
        height: 38px;
        border: 1px solid var(--border);
        background: white;
        border-radius: 9px;
        font-size: 19px;
      }

      .content {
        max-width: 1600px;
        margin: 0 auto;
        padding: 32px 34px 48px;
      }

      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 20px;
        margin-bottom: 10px;
      }

      .page-title {
        margin: 0;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .page-description {
        margin: 9px 0 0;
        color: var(--text-sub);
        font-size: 13px;
        line-height: 1.6;
      }

      /* =========================
       4. 공통 카드
    ========================= */
      .card {
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .card-header {
        padding: 20px 22px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .card-title {
        margin: 0;
        font-size: 15px;
        font-weight: 750;
      }

      .card-description {
        margin-top: 6px;
        color: var(--text-sub);
        font-size: 12px;
      }

      .card-body {
        padding: 22px;
      }

      /* =========================
       7. 로그 탭
    ========================= */
      .logs-card {
        overflow: hidden;
      }

      .log-tabs {
        display: flex;
        gap: 25px;
        padding: 0 22px;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }

      .log-tab {
        flex-shrink: 0;
        padding: 18px 1px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--text-sub);
        font-size: 13px;
        font-weight: 650;
      }

      .log-tab.active {
        border-bottom-color: var(--primary);
        color: var(--primary-dark);
      }

      .log-toolbar {
        padding: 18px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        align-items: center;
      }

      .control {
        min-height: 38px;
        padding: 8px 11px;
        border: 1px solid #dfe5e8;
        border-radius: 8px;
        background: white;
        color: var(--text);
        min-width: 0;
      }

      .search-input {
        width: 230px;
      }

      .btn {
        min-height: 38px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        color: var(--text);
        font-size: 12px;
        font-weight: 650;
        white-space: nowrap;
      }

      .btn:hover {
        background: #f7f9f8;
      }

      .btn-primary {
        border-color: var(--primary);
        background: var(--primary);
        color: white;
      }

      .btn-primary:hover {
        background: var(--primary-dark);
        color: white;
      }

      .table-meta {
        padding: 0 22px 14px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--text-sub);
        font-size: 12px;
      }

      .table-wrap {
        width: 100%;
        overflow-x: auto;
        border-top: 1px solid var(--border);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        white-space: nowrap;
      }

      th {
        padding: 14px 18px;
        background: #f8faf9;
        color: #697681;
        font-size: 11px;
        font-weight: 750;
      }

      td {
        padding: 16px 18px;
        border-top: 1px solid #edf0f2;
        font-size: 12px;
        color: #46535e;
      }

      tbody tr:hover {
        background: #fafcfb;
      }

      .cell-main {
        color: var(--text);
        font-weight: 650;
      }

      .cell-sub {
        margin-top: 4px;
        color: var(--text-sub);
        font-size: 11px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 5px 9px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 750;
      }

      .badge-success {
        color: #087354;
        background: #e5f5ec;
      }

      .badge-warning {
        color: #98600d;
        background: #fff3dc;
      }

      .badge-danger {
        color: #b72f2f;
        background: #fdeaea;
      }

      .badge-neutral {
        color: #64717b;
        background: #edf0f2;
      }

      .table-empty {
        padding: 45px 20px;
        color: var(--text-sub);
        text-align: center;
        white-space: normal;
      }

      .table-footer {
        padding: 14px 22px 16px;
        display: flex;
        flex-direction: column; /* 세로 배치 */
        align-items: center; /* 가운데 정렬 */
        gap: 6px;
        min-width: 0;
        color: var(--text-sub);
        font-size: 12px;
      }

      #pageInfo {
        order: 2;
        margin-top: 10px;
      }

      .footer-buttons {
        order: 1;
        display: flex;
        align-items: center;
        gap: 7px;

        /* 버튼이 많아져도 영역 밖으로 잘리지 않도록 처리 */
        flex: 0 1 auto;
        min-width: 0;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;

        /* 스크롤할 때 버튼이 잘리지 않도록 여백 확보 */
        padding: 2px 2px 6px;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }

      /* 페이지 버튼 크기 유지 */
      .page-btn {
        flex: 0 0 32px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: white;
        color: var(--text);
      }

      .page-btn.active {
        background: var(--primary-light);
        border-color: #b7dfcc;
        color: var(--primary-dark);
        font-weight: 800;
      }

      /* 페이지 버튼 영역의 가로 스크롤바 */
      .footer-buttons::-webkit-scrollbar {
        height: 6px;
      }

      .footer-buttons::-webkit-scrollbar-track {
        background: #f1f4f2;
        border-radius: 10px;
      }

      .footer-buttons::-webkit-scrollbar-thumb {
        background: #c5d8ce;
        border-radius: 10px;
      }

      .footer-buttons::-webkit-scrollbar-thumb:hover {
        background: #8bb9a2;
      }

      .overlay {
        display: none;
      }

      /* =========================
        서비스 이용 순위 (컴팩트 + 스크롤)
        ========================= */
      .service-rank {
        padding: 0 22px 16px;
        border-top: 1px solid var(--border);
      }
      .service-rank[hidden] {
        display: none;
      }

      /* 요약 카드 */
      .rank-summary {
        margin: 12px 0 10px;
        padding: 10px 16px;
        border-radius: 12px;
        background: var(--primary-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
      }
      .rank-summary-label {
        color: var(--text-sub);
        font-size: 12px;
      }
      .rank-summary-top {
        margin-top: 2px;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--primary-dark);
      }
      .rank-summary-total {
        text-align: right;
        color: var(--text-sub);
        font-size: 12px;
      }
      .rank-summary-total strong {
        display: block;
        margin-top: 2px;
        font-size: 17px;
        color: var(--text);
      }

      /* 순위 표 (약 5줄 높이, 넘치면 스크롤) */
      .rank-table-wrap {
        max-height: 232px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .rank-table-wrap thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 9px 14px;
      }
      .rank-table-wrap td {
        padding: 7px 14px;
      }

      /* 순위 배지 */
      .rank-badge {
        display: inline-grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #edf0f2;
        color: #64717b;
        font-size: 11px;
        font-weight: 800;
      }
      .rank-1 .rank-badge {
        background: #f7c948;
        color: #6b4a00;
      }
      .rank-2 .rank-badge {
        background: #dfe5e8;
        color: #46535e;
      }
      .rank-3 .rank-badge {
        background: #f5d3b3;
        color: #8a4b12;
      }
      .rank-1 td {
        background: #f6fbf8;
      }

      /* 비율 막대 */
      .rank-bar-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 160px;
      }
      .rank-bar-bg {
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: #edf0f2;
        overflow: hidden;
      }
      .rank-bar {
        height: 100%;
        border-radius: 999px;
        background: #9cd2b8;
        transition: width 0.4s ease;
      }
      .rank-1 .rank-bar {
        background: var(--primary);
      }
      .rank-pct {
        width: 46px;
        text-align: right;
        color: var(--text);
        font-weight: 700;
      }

      /* 스크롤바 */
      .rank-table-wrap::-webkit-scrollbar {
        width: 6px;
      }
      .rank-table-wrap::-webkit-scrollbar-track {
        background: #f1f4f2;
        border-radius: 10px;
      }
      .rank-table-wrap::-webkit-scrollbar-thumb {
        background: #c5d8ce;
        border-radius: 10px;
      }
      .rank-table-wrap::-webkit-scrollbar-thumb:hover {
        background: #8bb9a2;
      }

      /* 모바일 */
      @media (max-width: 760px) {
        .service-rank {
          padding: 0 16px 14px;
        }
        .rank-table-wrap {
          max-height: 200px;
        }
      }

      /* =========================
       8. 반응형: 태블릿
    ========================= */
      @media (max-width: 1200px) {
        :root {
          --sidebar-width: 220px;
        }

        .content {
          padding: 27px 24px 40px;
        }

        .topbar {
          padding: 0 24px;
        }

        .stats-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .charts-grid {
          grid-template-columns: 1fr;
        }
      }

      /* =========================
       9. 반응형: 모바일
    ========================= */
      @media (max-width: 760px) {
        .sidebar {
          transform: translateX(-100%);
          box-shadow: none;
        }

        .sidebar.open {
          transform: translateX(0);
          box-shadow: 8px 0 30px rgba(20, 35, 30, 0.12);
        }

        .overlay.show {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 90;
          background: rgba(20, 30, 25, 0.35);
        }

        .main {
          margin-left: 0;
        }

        .topbar {
          height: 64px;
          padding: 0 16px;
        }

        .menu-toggle {
          display: block;
        }

        .topbar-right .admin-label {
          display: none;
        }

        .content {
          padding: 23px 15px 32px;
        }

        .page-heading {
          flex-direction: column;
          gap: 10px;
          margin-bottom: 20px;
        }

        .page-title {
          font-size: 23px;
        }

        .stats-grid {
          gap: 10px;
        }

        .stat-card {
          padding: 15px;
        }

        .stat-value {
          font-size: 24px;
          margin-top: 14px;
        }

        .stat-icon {
          width: 31px;
          height: 31px;
        }

        .card-header,
        .card-body {
          padding: 17px;
        }

        .log-tabs {
          gap: 20px;
          padding: 0 16px;
        }

        .log-toolbar {
          align-items: stretch;
          padding: 15px 16px;
        }

        .filters {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .filters .control,
        .filters .search-input {
          width: 100%;
        }

        .filters .search-input {
          grid-column: 1 / -1;
        }

        .filters .btn {
          width: 100%;
        }

        .table-meta {
          padding: 0 16px 13px;
        }

        .table-footer {
          padding: 14px 16px;
        }

        .chart-area {
          gap: 5px;
        }

        .chart-bar {
          width: 65%;
        }
      }

      @media (max-width: 380px) {
        .stats-grid {
          grid-template-columns: 1fr;
        }

        .stat-card {
          padding: 18px;
        }

        .filters {
          grid-template-columns: 1fr;
        }

        .filters .search-input {
          grid-column: auto;
        }

        .table-footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }
      .app,
      .main {
        min-height: 100vh;
        min-height: 100dvh; /* 모바일 주소창 높이 대응 */
      }

      .rank-table-wrap th:nth-child(1) {
        width: 72px;
      }
      .rank-table-wrap th:nth-child(2) {
        width: 160px;
      }
      .rank-table-wrap th:nth-child(4) {
        width: 100px;
        text-align: right;
      }

      /* ---------- 대형 화면 ---------- */
      @media (min-width: 1800px) {
        :root {
          --sidebar-width: 272px;
        }

        body {
          font-size: 15px;
        }

        .topbar {
          height: 84px;
          padding: 0 48px;
        }
        .content {
          max-width: 1920px;
          padding: 25px 48px 56px;
        }
        .page-title {
          font-size: 30px;
        }

        .btn {
          font-size: 13px;
        }
        th {
          font-size: 12px;
        }
        td {
          font-size: 13px;
          padding: 16px 20px;
        }
      }

      /* ---------- 태블릿 ---------- */
      @media (max-width: 1200px) {
        :root {
          --sidebar-width: 220px;
        }

        .topbar {
          padding: 0 24px;
        }
        .content {
          padding: 27px 24px 40px;
        }
      }

      /* ---------- 사이드바 접힘 (태블릿 세로 이하) ---------- */
      @media (max-width: 900px) {
        .sidebar {
          width: min(280px, 82vw);
          overflow-y: auto; /* 가로로 눕힌 폰에서도 메뉴 접근 */
          transform: translateX(-100%);
          box-shadow: none;
        }

        .sidebar.open {
          transform: translateX(0);
          box-shadow: 8px 0 30px rgba(20, 35, 30, 0.12);
        }

        .overlay.show {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 90;
          background: rgba(20, 30, 25, 0.35);
        }

        .main {
          margin-left: 0;
        }

        .menu-toggle {
          display: grid;
          place-items: center;
        }

        .topbar {
          height: 64px;
          padding: 0 16px;
        }
        .content {
          padding: 23px 16px 32px;
        }

        .page-heading {
          flex-direction: column;
          gap: 10px;
          margin-bottom: 20px;
        }
        .page-title {
          font-size: 23px;
        }

        .card-header {
          padding: 17px;
        }
        .log-toolbar {
          padding: 15px 16px;
        }
        .table-meta {
          padding: 0 16px 13px;
        }
        .table-footer {
          padding: 14px 16px;
        }

        .service-rank {
          padding: 0 16px 14px;
        }
        .rank-table-wrap {
          max-height: 200px;
        }
      }

      /* ---------- 모바일 ---------- */
      @media (max-width: 600px) {
        .topbar-right .admin-label,
        #currentDate {
          display: none;
        }

        .breadcrumb {
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        .card-header {
          flex-wrap: wrap;
        }

        /* 필터: 2열 격자 */
        .log-toolbar {
          align-items: stretch;
        }
        .filters {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          width: 100%;
        }
        .filters .control,
        .filters .search-input,
        .filters .btn {
          width: 100%;
        }
        .filters .search-input {
          grid-column: 1 / -1;
        }
        #exportButton {
          width: 100%;
        }

        .table-meta {
          flex-direction: column;
          gap: 4px;
        }

        /* 로그 표 → 카드형 (td에 data-label 필요: 아래 JS 수정 참고) */
        .table-wrap:not(.rank-table-wrap) > table,
        #tableBody,
        #tableBody tr,
        #tableBody td {
          display: block;
        }

        #tableHead {
          /* 눈에만 숨기고 스크린리더용으로 유지 */
          position: absolute;
          width: 1px;
          height: 1px;
          margin: -1px;
          padding: 0;
          border: 0;
          overflow: hidden;
          clip: rect(0 0 0 0);
          white-space: nowrap;
        }

        #tableBody tr {
          padding: 12px 16px;
          border-top: 1px solid var(--border);
        }
        #tableBody tr:first-child {
          border-top: 0;
        }

        #tableBody td {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          gap: 14px;
          padding: 5px 0;
          border: 0;
          text-align: right;
          white-space: normal;
          overflow-wrap: anywhere;
        }

        #tableBody td::before {
          content: attr(data-label);
          flex: 0 0 76px;
          color: var(--text-sub);
          font-size: 11px;
          font-weight: 700;
          text-align: left;
        }

        #tableBody td.table-empty {
          display: block;
          padding: 45px 20px;
          text-align: center;
        }
        #tableBody td.table-empty::before {
          content: none;
        }

        /* 서비스 순위: 폰 폭에 맞게 압축 */
        .rank-summary {
          padding: 10px 14px;
        }
        .rank-table-wrap th:nth-child(1) {
          width: 44px;
        }
        .rank-table-wrap th:nth-child(2) {
          width: auto;
        }
        .rank-table-wrap th:nth-child(4) {
          width: 64px;
        }
        .rank-table-wrap thead th,
        .rank-table-wrap td {
          padding-left: 8px;
          padding-right: 8px;
        }
        .rank-bar-wrap {
          min-width: 64px;
          gap: 8px;
        }
        .rank-pct {
          width: 40px;
        }
      }

      /* ---------- 소형 폰 ---------- */
      @media (max-width: 380px) {
        .content {
          padding: 18px 12px 28px;
        }
        .page-title {
          font-size: 21px;
        }

        .filters {
          grid-template-columns: 1fr;
        }
        .filters .search-input {
          grid-column: auto;
        }

        .rank-bar-wrap {
          min-width: 48px;
        }
        .rank-pct {
          width: 36px;
          font-size: 12px;
        }
      }

      /* ---------- 가로로 눕힌 낮은 화면 ---------- */
      @media (max-height: 500px) and (orientation: landscape) {
        .topbar {
          height: 56px;
        }
        .content {
          padding-top: 18px;
        }
      }

      /* ---------- 터치 기기: 누르기 쉬운 크기 ---------- */
      @media (pointer: coarse) {
        .btn,
        .control {
          min-height: 44px;
        }

        .page-btn {
          flex: 0 0 40px;
          width: 40px;
          height: 40px;
        }
        .nav-item {
          min-height: 48px;
        }
        .menu-toggle {
          width: 44px;
          height: 44px;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <!-- 모바일 메뉴 배경 -->
      <div class="overlay" id="overlay"></div>

      <!-- 사이드바 -->
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-logo">AI</div>
          <div>
            <div class="brand-name">AI 라운지</div>
            <div class="brand-sub">SERVICE ADMINISTRATION</div>
          </div>
        </div>

        <div class="nav-label">MANAGEMENT</div>

        <nav class="nav-menu" aria-label="관리 메뉴">
          <button class="nav-item" data-page="session">
            <span class="nav-icon">◷</span>
            세션 로그
          </button>

          <button class="nav-item" data-page="satisfaction">
            <span class="nav-icon">☆</span>
            만족도 로그
          </button>

          <button class="nav-item" data-page="qa">
            <span class="nav-icon">☷</span>
            QA 로그
          </button>

          <button class="nav-item" data-page="usage">
            <span class="nav-icon">⌘</span>
            서비스 이용 로그
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div><span class="status-dot"></span>로그 관리 화면</div>
          <div>AI Lounge Admin</div>
        </div>
      </aside>

      <!-- 메인 -->
      <main class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="menu-toggle"
              id="menuToggle"
              aria-label="메뉴 열기"
              aria-expanded="false"
            >
              ☰
            </button>

            <div class="breadcrumb">
              AI 라운지 &nbsp; / &nbsp;
              <strong id="breadcrumbTitle">대시보드</strong>
            </div>
          </div>

          <div class="topbar-right">
            <span id="currentDate"></span>
            <div class="admin-avatar">A</div>
            <span class="admin-label">관리자</span>
          </div>
        </header>

        <div class="content">
          <!-- 페이지 제목 -->
          <section class="page-heading">
            <div>
              <h1 class="page-title" id="pageTitle">서비스 로그 대시보드</h1>
              <p class="page-description" id="pageDescription">
                AI 라운지의 이용 현황과 서비스 로그를 확인합니다.
              </p>
            </div>
          </section>

          <!-- 로그 테이블 -->
          <section class="card logs-card">
            <div class="card-header">
              <div>
                <h2 class="card-title" id="tableTitle">최근 서비스 로그</h2>
                <div class="card-description" id="tableDescription">
                  로그 유형을 선택해 상세 기록을 확인할 수 있습니다.
                </div>
              </div>
              <span class="badge badge-neutral">로그 조회</span>
            </div>

            <!-- 검색 및 필터 -->
            <div class="log-toolbar">
              <div class="filters">
                <select class="control" id="dateFilter" aria-label="기간 선택">
                  <option value="all">전체 기간</option>
                  <option value="today">오늘</option>
                  <option value="7">최근 7일</option>
                  <option value="30">최근 30일</option>
                </select>

                <select class="control" id="typeFilter" aria-label="유형 필터">
                  <option value="all">전체 유형</option>
                </select>

                <input
                  class="control search-input"
                  type="search"
                  id="searchInput"
                  placeholder="키워드 검색"
                  aria-label="로그 검색"
                />

                <button class="btn" id="resetButton">초기화</button>
              </div>

              <button class="btn btn-primary" id="exportButton">
                ↓ CSV 내보내기
              </button>
            </div>

            <!-- 서비스 이용 순위 (서비스 이용 로그 탭에서만 표시) -->
            <div class="service-rank" id="serviceRank" hidden>
              <div class="rank-summary">
                <div>
                  <div class="rank-summary-label">가장 많이 이용한 서비스</div>
                  <div class="rank-summary-top" id="rankTop">-</div>
                </div>
                <div class="rank-summary-total">
                  총 서비스 이용
                  <strong id="rankTotal">0회</strong>
                </div>
              </div>

              <div class="table-wrap rank-table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>순위</th>
                      <th>서비스</th>
                      <th>이용 비율</th>
                      <th>이용 횟수</th>
                    </tr>
                  </thead>
                  <tbody id="rankBody"></tbody>
                </table>
              </div>
            </div>

            <div class="table-meta">
              <span id="resultCount">총 0건</span>
            </div>

            <div class="table-wrap">
              <table>
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>

            <div class="table-footer">
              <span id="pageInfo">1페이지</span>
              <div class="footer-buttons" id="pagination"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script>
      /* =====================================
     1. 샘플 데이터
     실제 API 연동 시 이 부분을 교체합니다.
  ===================================== */

      const logsData = {
        session: [],
        satisfaction: [],
        qa: [],
        usage: [],
      };

      /* =====================================
     2. 테이블 설정
  ===================================== */

      const tableConfig = {
        session: {
          title: "세션 로그",
          description: "방문 세션과 서비스 이용 시간을 확인합니다.",
          columns: [
            ["id", "로그 ID"],
            ["date", "접속 일시"],
            ["sessionId", "세션 ID"],
            ["path", "진입 경로"],
            ["service", "서비스 유형"],
            ["duration", "이용 시간"],
            ["status", "종료 상태"],
          ],
          filters: [
            ["홈", "홈"],
            ["음성 서비스", "음성 서비스"],
            ["채팅 서비스", "채팅 서비스"],
            ["대시보드", "대시보드"],
            ["지도 서비스", "지도 서비스"],
          ],
        },

        satisfaction: {
          title: "만족도 로그",
          description: "이용자 만족도와 재이용 의향을 확인합니다.",
          columns: [
            ["id", "로그 ID"],
            ["date", "응답 일시"],
            ["sessionId", "세션 ID"],
            ["score", "만족도"],
            ["reuse", "재이용 의향"],
            ["understanding", "이해도"],
            ["comment", "의견"],
          ],
          filters: [
            ["5", "만족도 5점"],
            ["4", "만족도 4점"],
            ["3", "만족도 3점 이하"],
          ],
        },

        qa: {
          title: "QA 로그",
          description: "질문 유형과 응답 결과를 확인합니다.",
          columns: [
            ["id", "로그 ID"],
            ["date", "질문 일시"],
            ["sessionId", "세션 ID"],
            ["question", "질문 내용"],
            ["intent", "질문 유형"],
            ["source", "응답 출처"],
            ["success", "응답 결과"],
            ["retries", "재시도"],
          ],
          filters: [
            ["성공", "응답 성공"],
            ["실패", "응답 실패"],
          ],
        },

        usage: {
          title: "서비스 이용 로그",
          description: "어떤 서비스를 이용했는지 기록을 확인합니다.",
          columns: [
            ["id", "로그 ID"],
            ["date", "이용 일시"],
            ["sessionId", "세션 ID"],
            ["service", "서비스 유형"],
            ["question", "질문 내용"],
          ],
          filters: [
            ["음성 서비스", "음성 서비스"],
            ["채팅 서비스", "채팅 서비스"],
            ["행정 안내", "행정 안내"],
            ["복지 서비스", "복지 서비스"],
            ["교통 정보", "교통 정보"],
            ["안전 정보", "안전 정보"],
            ["에너지/충전", "에너지/충전"],
            ["문화·행사", "문화·행사"],
            ["대시보드", "대시보드"],
            ["지도 서비스", "지도 서비스"],
          ],
        },
      };

      /* =====================================
     3. 상태 관리
  ===================================== */

      let currentTab = "session";
      let currentPage = 1;
      const pageSize = 10;

      const searchInput = document.getElementById("searchInput");
      const dateFilter = document.getElementById("dateFilter");
      const typeFilter = document.getElementById("typeFilter");

      const pageTitles = {
        overview: {
          title: "서비스 로그 대시보드",
          description: "AI 라운지의 이용 현황과 서비스 로그를 확인합니다.",
        },
        session: {
          title: "세션 로그",
          description:
            "세션 시작, 이용 경로, 이용 시간과 종료 상태를 확인합니다.",
        },
        satisfaction: {
          title: "만족도 로그",
          description: "서비스 만족도와 재이용 의향, 사용자 의견을 확인합니다.",
        },
        qa: {
          title: "QA 로그",
          description:
            "사용자 질문, 응답 유형, 성공 여부와 재시도 횟수를 확인합니다.",
        },
        usage: {
          title: "서비스 이용 로그",
          description: "서비스 유형별 이용 기록을 확인합니다.",
        },
      };

      /* =====================================
     4. 공통 함수
  ===================================== */

      function escapeHTML(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (char) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[char],
        );
      }

      function formatNumber(value) {
        return Number(value).toLocaleString("ko-KR");
      }

      function formatDuration(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = seconds % 60;

        if (minutes === 0) {
          return `${remainingSeconds}초`;
        }

        return `${minutes}분 ${remainingSeconds}초`;
      }

      function getDateValue(dateString) {
        return new Date(dateString.replace(" ", "T"));
      }

      function isWithinDateRange(dateString) {
        const selected = dateFilter.value;

        if (selected === "all") {
          return true;
        }

        const date = getDateValue(dateString);

        if (Number.isNaN(date.getTime())) {
          return false;
        }

        const now = new Date();
        const start = new Date(now);

        if (selected === "today") {
          start.setHours(0, 0, 0, 0);
        } else {
          start.setDate(start.getDate() - Number(selected) + 1);
          start.setHours(0, 0, 0, 0);
        }

        return date >= start && date <= now;
      }

      function getFilteredLogs(tab = currentTab) {
        const logs = logsData[tab] || [];
        const keyword = searchInput.value.trim().toLowerCase();
        const selectedType = typeFilter.value;

        return logs.filter((log) => {
          const searchableText = Object.values(log).join(" ").toLowerCase();

          const matchesKeyword = !keyword || searchableText.includes(keyword);

          let matchesType = true;

          if (selectedType !== "all") {
            if (tab === "qa") {
              if (["성공", "실패"].includes(selectedType)) {
                matchesType = log.success === selectedType;
              } else {
                matchesType = log.source === selectedType;
              }
            } else if (tab === "satisfaction") {
              if (selectedType === "3") {
                matchesType = Number(log.score) <= 3;
              } else {
                matchesType = String(log.score) === selectedType;
              }
            } else {
              matchesType = log.service === selectedType;
            }
          }

          return matchesKeyword && matchesType;
        });
      }

      async function loadLogs(tab = currentTab) {
        document.getElementById("serviceRank").hidden = true;
        const body = document.getElementById("tableBody");

        body.innerHTML = `
    <tr>
      <td colspan="10" class="table-empty">
        DB에서 로그를 불러오는 중입니다.
      </td>
    </tr>
  `;

        try {
          const period = dateFilter.value;
          const search = searchInput.value.trim();

          const params = new URLSearchParams({
            period,
            search,
          });

          const response = await fetch(
            `/api/admin/logs/${tab}?${params.toString()}`,
          );

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "로그 조회 실패");
          }

          logsData[tab] = result.logs || [];

          currentPage = 1;
          renderTable();

          document.getElementById("resultCount").textContent =
            `조회 결과 ${result.count.toLocaleString("ko-KR")}건`;
        } catch (error) {
          console.error("로그 조회 오류:", error);

          body.innerHTML = `
            <tr>
                <td colspan="10" class="table-empty">
                로그를 불러오지 못했습니다.
                Flask 서버와 DB 연결 상태를 확인해주세요.
                </td>
            </tr>
            `;
        }
      }

      function badgeHTML(value) {
        let badgeClass = "badge-neutral";

        if (["성공", "정상 종료", "예"].includes(value)) {
          badgeClass = "badge-success";
        } else if (["실패", "시간 초과"].includes(value)) {
          badgeClass = "badge-danger";
        } else if (["보통"].includes(value)) {
          badgeClass = "badge-warning";
        }

        return `<span class="badge ${badgeClass}">${escapeHTML(value)}</span>`;
      }

      function formatCell(key, value) {
        if (key === "duration") {
          return formatDuration(Number(value));
        }

        if (key === "score") {
          return `${escapeHTML(value)}점`;
        }

        if (key === "understanding") {
          return `${escapeHTML(value)}점`;
        }

        if (key === "retries") {
          return `${escapeHTML(value)}회`;
        }

        if (key === "status" || key === "success" || key === "reuse") {
          return badgeHTML(String(value));
        }

        return escapeHTML(value);
      }

      /* =====================================
     5. 로그 유형 전환
  ===================================== */

      function switchTab(tab) {
        if (!tableConfig[tab]) return;

        currentTab = tab;
        currentPage = 1;

        document.getElementById("serviceRank").hidden = tab !== "usage";

        document.querySelectorAll(".log-tab").forEach((button) => {
          const active = button.dataset.tab === tab;

          button.classList.toggle("active", active);
          button.setAttribute("aria-selected", String(active));
        });

        document.querySelectorAll(".nav-item").forEach((button) => {
          button.classList.toggle("active", button.dataset.page === tab);
        });

        const config = tableConfig[tab];

        document.getElementById("tableTitle").textContent = config.title;

        document.getElementById("tableDescription").textContent =
          config.description;

        document.getElementById("pageTitle").textContent =
          pageTitles[tab].title;

        document.getElementById("pageDescription").textContent =
          pageTitles[tab].description;

        document.getElementById("breadcrumbTitle").textContent =
          pageTitles[tab].title;

        typeFilter.innerHTML =
          '<option value="all">전체 유형</option>' +
          config.filters
            .map(
              ([value, label]) =>
                `<option value="${escapeHTML(value)}">${escapeHTML(label)}</option>`,
            )
            .join("");

        searchInput.value = "";
        dateFilter.value = "all";

        loadLogs(tab);
      }

      /* =====================================
     6. 테이블 렌더링
  ===================================== */

      function renderTable() {
        const config = tableConfig[currentTab];
        const logs = getFilteredLogs();

        const head = document.getElementById("tableHead");
        const body = document.getElementById("tableBody");

        head.innerHTML = `
      <tr>
        ${config.columns
          .map(([key, label]) => `<th scope="col">${escapeHTML(label)}</th>`)
          .join("")}
      </tr>
    `;

        const totalPages = Math.max(1, Math.ceil(logs.length / pageSize));

        currentPage = Math.min(currentPage, totalPages);

        const startIndex = (currentPage - 1) * pageSize;
        const pageLogs = logs.slice(startIndex, startIndex + pageSize);

        if (pageLogs.length === 0) {
          body.innerHTML = `
        <tr>
          <td colspan="${config.columns.length}" class="table-empty">
            검색 조건에 맞는 로그가 없습니다.
          </td>
        </tr>
      `;
        } else {
          body.innerHTML = pageLogs
            .map(
              (log) => `
        <tr>
          ${config.columns
            .map(
              ([key, label]) =>
                `<td data-label="${escapeHTML(label)}">${formatCell(key, log[key])}</td>`,
            )
            .join("")}
        </tr>
      `,
            )
            .join("");
        }

        document.getElementById("resultCount").textContent =
          `총 ${formatNumber(logs.length)}건`;

        document.getElementById("pageInfo").textContent =
          `${currentPage} / ${totalPages} 페이지`;

        renderPagination(totalPages);
        renderServiceRanking();
      }

      function renderServiceRanking() {
        const box = document.getElementById("serviceRank");

        if (currentTab !== "usage") {
          box.hidden = true;
          return;
        }

        box.hidden = false;

        // 서비스별 횟수 집계 ('방문 세션'은 서비스 이용이 아니므로 제외)
        const counts = {};

        (logsData.usage || []).forEach((log) => {
          const name = String(log.service ?? "").trim();
          if (!name || name === "방문 세션") return;
          counts[name] = (counts[name] || 0) + 1;
        });

        const ranking = Object.entries(counts)
          .map(([name, count]) => ({ name, count }))
          .sort(
            (a, b) => b.count - a.count || a.name.localeCompare(b.name, "ko"),
          );

        const total = ranking.reduce((sum, item) => sum + item.count, 0);
        const max = ranking.length ? ranking[0].count : 0;

        const body = document.getElementById("rankBody");

        if (ranking.length === 0) {
          document.getElementById("rankTop").textContent = "-";
          document.getElementById("rankTotal").textContent = "0회";
          body.innerHTML = `
            <tr>
                <td colspan="4" class="table-empty">집계할 서비스 이용 기록이 없습니다.</td>
            </tr>`;
          return;
        }

        const topPct = ((ranking[0].count / total) * 100).toFixed(1);

        document.getElementById("rankTop").textContent =
          `${ranking[0].name} · ${topPct}%`;
        document.getElementById("rankTotal").textContent =
          `${formatNumber(total)}회`;

        body.innerHTML = ranking
          .map((item, index) => {
            const pct = (item.count / total) * 100;
            const width = (item.count / max) * 100;

            return `
            <tr class="rank-${index + 1}">
            <td><span class="rank-badge">${index + 1}</span></td>
            <td class="cell-main">${escapeHTML(item.name)}</td>
            <td>
                <div class="rank-bar-wrap">
                <div class="rank-bar-bg">
                    <div class="rank-bar" style="width:${width.toFixed(1)}%"></div>
                </div>
                <span class="rank-pct">${pct.toFixed(1)}%</span>
                </div>
            </td>
            <td class="cell-main" style="text-align:right">
                ${formatNumber(item.count)}회
            </td>
            </tr>`;
          })
          .join("");
      }

      function renderPagination(totalPages) {
        const pagination = document.getElementById("pagination");

        let html = `
      <button class="page-btn"
        data-page="${currentPage - 1}"
        ${currentPage === 1 ? "disabled" : ""}
        aria-label="이전 페이지">‹</button>
    `;

        for (let i = 1; i <= totalPages; i++) {
          html += `
        <button class="page-btn ${i === currentPage ? "active" : ""}"
          data-page="${i}"
          ${i === currentPage ? 'aria-current="page"' : ""}
        >${i}</button>
      `;
        }

        html += `
      <button class="page-btn"
        data-page="${currentPage + 1}"
        ${currentPage === totalPages ? "disabled" : ""}
        aria-label="다음 페이지">›</button>
    `;

        pagination.innerHTML = html;
      }

      /* =====================================
     8. CSV 내보내기
  ===================================== */

      function exportCSV() {
        const config = tableConfig[currentTab];
        const logs = getFilteredLogs();

        if (logs.length === 0) {
          alert("내보낼 로그가 없습니다.");
          return;
        }

        const headers = config.columns.map(([, label]) => label);

        const rows = logs.map((log) =>
          config.columns.map(([key]) => {
            let value = log[key] ?? "";

            if (key === "duration") {
              value = formatDuration(Number(value));
            }

            // CSV 셀의 쉼표, 따옴표, 줄바꿈 처리
            value = String(value).replace(/"/g, '""');

            return `"${value}"`;
          }),
        );

        const csvContent = [
          headers.map((value) => `"${value}"`).join(","),
          ...rows.map((row) => row.join(",")),
        ].join("\r\n");

        // Excel에서 한글을 읽기 쉽도록 BOM 추가
        const blob = new Blob(["\uFEFF" + csvContent], {
          type: "text/csv;charset=utf-8;",
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");

        link.href = url;
        link.download = `ai_lounge_${currentTab}_logs.csv`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);
      }

      /* =====================================
     9. 모바일 메뉴
  ===================================== */

      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("overlay");
      const menuToggle = document.getElementById("menuToggle");

      function closeMenu() {
        sidebar.classList.remove("open");
        overlay.classList.remove("show");
        menuToggle.setAttribute("aria-expanded", "false");
      }

      menuToggle.addEventListener("click", () => {
        const isOpen = sidebar.classList.toggle("open");

        overlay.classList.toggle("show", isOpen);
        menuToggle.setAttribute("aria-expanded", String(isOpen));
      });

      overlay.addEventListener("click", closeMenu);
      window
        .matchMedia("(min-width: 901px)")
        .addEventListener("change", (event) => {
          if (event.matches) closeMenu();
        });

      /* =====================================
     10. 이벤트 연결
  ===================================== */

      document.querySelectorAll(".log-tab").forEach((button) => {
        button.addEventListener("click", () => {
          switchTab(button.dataset.tab);
        });
      });

      document.querySelectorAll(".nav-item").forEach((button) => {
        button.addEventListener("click", () => {
          const page = button.dataset.page;

          if (page === "overview") {
            document.getElementById("pageTitle").textContent =
              pageTitles.overview.title;

            document.getElementById("pageDescription").textContent =
              pageTitles.overview.description;

            document.getElementById("breadcrumbTitle").textContent =
              pageTitles.overview.title;

            closeMenu();
            return;
          }

          switchTab(page);
          closeMenu();

          document.querySelector(".logs-card").scrollIntoView({
            behavior: "smooth",
            block: "start",
          });
        });
      });

      let searchTimer;

      searchInput.addEventListener("input", () => {
        clearTimeout(searchTimer);

        searchTimer = setTimeout(() => {
          loadLogs(currentTab);
        }, 300);
      });

      dateFilter.addEventListener("change", () => {
        loadLogs(currentTab);
      });

      typeFilter.addEventListener("change", () => {
        currentPage = 1;
        renderTable();
      });

      document.getElementById("resetButton").addEventListener("click", () => {
        searchInput.value = "";
        dateFilter.value = "all";
        typeFilter.value = "all";

        loadLogs(currentTab);
      });

      document
        .getElementById("exportButton")
        .addEventListener("click", exportCSV);

      document
        .getElementById("pagination")
        .addEventListener("click", (event) => {
          const button = event.target.closest("[data-page]");

          if (!button || button.disabled) return;

          const page = Number(button.dataset.page);

          if (page < 1) return;

          currentPage = page;
          renderTable();
        });

      /* =====================================
     11. 초기 실행
  ===================================== */

      function init() {
        const now = new Date();

        document.getElementById("currentDate").textContent =
          now.toLocaleDateString("ko-KR", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          });

        switchTab("session");
      }

      init();
    </script>
  </body>
</html>
